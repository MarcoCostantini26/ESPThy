<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>ESPThy - Tracciato Bicolore</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #FF0000; }
        svg { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
        <!-- Muro Esterno (Rosso) -->
        <rect width="1920" height="1080" fill="#FF0000" />
        
        <!-- Pista (Verde) -->
        <path d="M 300 300 L 1600 300 L 1600 900 L 1100 900 L 1100 500 L 800 500 L 800 900 L 300 900 Z" 
              stroke="#00FF00" stroke-width="220" fill="none" stroke-linejoin="miter" stroke-linecap="square"/>
              
        <!-- Muro Interno (Blu) - Questo è il blocco in mezzo alla U -->
        <polygon points="410,410 1490,410 1490,790 1210,790 1210,390 690,390 690,790 410,790" fill="#0000FF" />
    </svg>
</body>
</html>
